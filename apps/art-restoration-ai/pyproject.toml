[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "art-restoration-ai"
version = "1.0.0.dev1"
description = "Quality-first modular art and photo restoration orchestration platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "Pillow>=10.4,<13",
  "numpy>=1.26,<3",
  "python-multipart>=0.0.9",
  "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6"]
gpu = ["torch>=2.4", "torchvision>=0.19", "opencv-python-headless>=4.10"]
vips = ["pyvips>=2.2"]

[tool.setuptools.packages.find]
include = ["app*", "restoration*", "resource_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
